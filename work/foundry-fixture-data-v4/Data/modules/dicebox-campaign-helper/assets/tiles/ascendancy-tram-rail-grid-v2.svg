<svg xmlns="http://www.w3.org/2000/svg" width="660" height="570" viewBox="0 0 660 570">
  <!-- Fixed visual projection of the 6×6 routing board.  No cars or cell
       markers appear here; those remain runtime Tile/Region projections. -->
  <defs>
    <linearGradient id="plate" x1="0" y1="0" x2="0" y2="1">
      <stop stop-color="#242321"/><stop offset=".48" stop-color="#131516"/><stop offset="1" stop-color="#25201b"/>
    </linearGradient>
    <linearGradient id="steel" x1="0" y1="0" x2="0" y2="1">
      <stop stop-color="#d0b06d"/><stop offset=".35" stop-color="#7d6031"/><stop offset=".62" stop-color="#2b241b"/><stop offset="1" stop-color="#b58b45"/>
    </linearGradient>
    <pattern id="ties" width="22" height="95" patternUnits="userSpaceOnUse">
      <path d="M2 7h18M2 88h18" stroke="#211b14" stroke-width="7"/>
      <path d="M2 7h18M2 88h18" stroke="#5e4827" stroke-width="1.5"/>
    </pattern>
  </defs>
  <rect width="660" height="570" rx="8" fill="url(#plate)" opacity=".58"/>
  <path d="M9 0v190M9 285v285M651 0v190M651 285v285M0 9h660M0 561h660" fill="none" stroke="#0b0d0e" stroke-width="18"/>
  <path d="M9 0v190M9 285v285M651 0v190M651 285v285M0 9h660M0 561h660" fill="none" stroke="#9c773d" stroke-width="3"/>
  <g stroke-linecap="square">
