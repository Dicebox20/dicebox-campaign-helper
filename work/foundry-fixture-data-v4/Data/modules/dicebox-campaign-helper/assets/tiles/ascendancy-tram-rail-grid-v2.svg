      <rect x="18" y="0" width="624" height="95"/><rect x="18" y="95" width="624" height="95"/>
      <rect x="18" y="190" width="624" height="95"/><rect x="18" y="285" width="624" height="95"/>
      <rect x="18" y="380" width="624" height="95"/><rect x="18" y="475" width="624" height="95"/>
    </g>
    <g fill="none" stroke="url(#steel)">
      <path d="M18 40h624M18 55h624" stroke-width="6"/>
      <path d="M18 135h624M18 150h624" stroke-width="6"/>
      <path d="M18 230h624M18 245h624" stroke-width="7"/>
      <path d="M18 325h624M18 340h624" stroke-width="6"/>
      <path d="M18 420h624M18 435h624" stroke-width="6"/>
      <path d="M18 515h624M18 530h624" stroke-width="6"/>
