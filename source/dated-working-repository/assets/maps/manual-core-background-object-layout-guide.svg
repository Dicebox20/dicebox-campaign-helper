<svg xmlns="http://www.w3.org/2000/svg" width="1536" height="1024" viewBox="0 0 1536 1024">
  <rect width="1536" height="1024" fill="#171717"/>
  <rect x="24" y="24" width="1488" height="976" rx="24" fill="#242424" stroke="#88703b" stroke-width="12"/>

  <!-- Locked native-door correspondences, rendered here only as a composition guide. -->
  <rect x="680" y="24" width="176" height="72" fill="#7d4db8" stroke="#d8b95f" stroke-width="8"/>
  <rect x="680" y="928" width="176" height="72" fill="#7d4db8" stroke="#d8b95f" stroke-width="8"/>
  <rect x="24" y="400" width="176" height="95" fill="#7d4db8" stroke="#d8b95f" stroke-width="8"/>

  <!-- Fixed central Background Object: aligns to the security-room rectangle. -->
  <rect x="500" y="410" width="536" height="200" rx="72" fill="#5c2d87" stroke="#d8b95f" stroke-width="14"/>
  <circle cx="768" cy="510" r="78" fill="#8e58c9" stroke="#e6c970" stroke-width="12"/>

  <!-- Six fixed station Background Objects, centered inside the canonical station Regions. -->
  <g fill="#3d2c4d" stroke="#d8b95f" stroke-width="10">
    <rect x="264" y="305" width="240" height="120" rx="24"/>
    <rect x="648" y="305" width="240" height="120" rx="24"/>
    <rect x="1032" y="305" width="240" height="120" rx="24"/>
    <rect x="264" y="610" width="240" height="120" rx="24"/>
    <rect x="648" y="610" width="240" height="120" rx="24"/>
    <rect x="1032" y="610" width="240" height="120" rx="24"/>
  </g>
  <g fill="#b87fe5">
    <circle cx="384" cy="365" r="30"/><circle cx="768" cy="365" r="30"/><circle cx="1152" cy="365" r="30"/>
    <circle cx="384" cy="670" r="30"/><circle cx="768" cy="670" r="30"/><circle cx="1152" cy="670" r="30"/>
  </g>

  <!-- Deliberately sealed east wall. -->
  <rect x="1450" y="100" width="38" height="824" fill="#4f4f4f" stroke="#88703b" stroke-width="6"/>
</svg>
