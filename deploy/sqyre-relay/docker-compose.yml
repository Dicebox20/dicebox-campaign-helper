services:
  relay:
    build:
      context: ../..
      dockerfile: deploy/sqyre-relay/Dockerfile
    env_file: .env
    expose:
      - "8798"
    restart: unless-stopped

  caddy:
    image: caddy:2-alpine
    env_file: .env
    depends_on:
      - relay
    ports:
      - "80:80"
      - "443:443"
    volumes:
      - ./Caddyfile:/etc/caddy/Caddyfile:ro
      - caddy_data:/data
      - caddy_config:/config
    restart: unless-stopped

volumes:
  caddy_data:
  caddy_config:
